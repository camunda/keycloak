---
# Temporary: proves the Vault JWT login works from this repository. Removed before merge.
name: vault-jwt-validation

on:
    pull_request:
        paths:
            - .github/workflows/vault-jwt-validation.yml

permissions:
    contents: read

jobs:
    vault-jwt:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Log in to Vault with JWT and read a secret
              uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
              with:
                  url: ${{ secrets.VAULT_ADDR }}
                  method: jwt
                  path: ${{ secrets.VAULT_JWT_PATH }}
                  role: ${{ secrets.VAULT_JWT_ROLE }}
                  jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
                  exportEnv: false
                  secrets: |
                      secret/data/products/infrastructure-experience/ci/common SLACK_BOT_TOKEN;
