---
# desc: create a daily GitHub release when Keycloak base images change (e.g. CVE patches picked up by Renovate)
name: release-keycloak-upgrade

on:
    workflow_dispatch:
    schedule:
        # Daily so CVE patches landing in a keycloak-<N>/bases.yml or keycloak-<N>/Dockerfile* file
        # (the patterns matched by the check-changes job) are released promptly.
        # The check-changes job guards against empty releases on days with no relevant change.
        - cron: 0 8 * * *

# Scheduled workflows run on the default branch only.
# See: https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

# The `release` job never writes through GITHUB_TOKEN: both the checkout and every `gh` call
# there run with the GitHub App token minted from Vault, which is also what lets the pushed tag
# trigger `build-images.yml` (GITHUB_TOKEN-created refs do not trigger workflows).
# `check-changes` only reads, so a read-only GITHUB_TOKEN is enough for the whole workflow.
permissions:
    contents: read

jobs:
    check-changes:
        runs-on: ubuntu-latest
        # The baseline step reads the build-images runs of past tags through the API, which needs
        # `actions: read` on top of the workflow-level `contents: read`.
        permissions:
            contents: read
            actions: read
        outputs:
            has_changes: ${{ steps.check.outputs.has_changes }}
            baseline_tag: ${{ steps.baseline.outputs.baseline_tag }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0

            # A release tag is created before the images it names exist: `build-images.yml` only
            # starts once the tag is pushed, and it can fail. Taking the newest tag as the
            # baseline therefore counts a failed build as "already released", and the guard below
            # then reports no change and never retries it. That is what happened to
            # 2026-08-13-001, refused at `read-build-image-output`: nothing was published and the
            # next scheduled run would have found nothing to do either.
            #
            # The baseline is the newest tag whose build-images run completed successfully, i.e.
            # the newest tag whose images are actually on the registries.
            - name: Resolve the last successfully published release tag
              id: baseline
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  baseline=""
                  building=""

                  while read -r tag; do
                    [ -n "${tag}" ] || continue

                    run=$(gh run list --workflow build-images.yml --branch "${tag}" --limit 1 \
                      --json status,conclusion --jq '.[0] | "\(.status)/\(.conclusion // "")"')

                    echo "${tag}: ${run:-no run found}"

                    case "${run}" in
                      completed/success)
                        baseline="${tag}"
                        break
                        ;;
                      completed/*|'')
                        : # failed, cancelled or never built: its images are missing, look further back
                        ;;
                      *)
                        : # queued or running: its outcome decides whether a new tag is needed at
                        : # all, so defer rather than stack a second release on top of it
                        building="${tag}"
                        break
                        ;;
                    esac
                  done < <(gh release list --limit 20 --json tagName --jq '.[].tagName')

                  echo "baseline_tag=${baseline}" | tee -a "$GITHUB_OUTPUT"
                  echo "building_tag=${building}" | tee -a "$GITHUB_OUTPUT"

            - name: Check for relevant changes since the last successful release
              id: check
              env:
                  BASELINE_TAG: ${{ steps.baseline.outputs.baseline_tag }}
                  BUILDING_TAG: ${{ steps.baseline.outputs.building_tag }}
              run: |
                  set -euo pipefail

                  if [ -n "${BUILDING_TAG}" ]; then
                    echo "::notice::${BUILDING_TAG} is still building; deferring to the next run."
                    echo "has_changes=false" | tee -a "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  if [ -z "${BASELINE_TAG}" ]; then
                    echo "::warning::None of the last 20 releases has a successful build-images run; releasing so the images get rebuilt."
                    echo "has_changes=true" | tee -a "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "Checking changes since tag: ${BASELINE_TAG}"
                  changed_files=$(git diff --name-only "${BASELINE_TAG}..HEAD")

                  # Check if any keycloak bases.yml or Dockerfile* files were changed
                  if echo "$changed_files" | grep -qE '^keycloak-[0-9]+/(bases\.yml|Dockerfile)'; then
                    echo "has_changes=true" | tee -a "$GITHUB_OUTPUT"
                  else
                    echo "has_changes=false" | tee -a "$GITHUB_OUTPUT"
                  fi

    release:
        runs-on: ubuntu-latest
        needs:
            - check-changes
        if: needs.check-changes.outputs.has_changes == 'true'
        steps:
            - name: Generate token for GitHub
              id: generate-github-token
              uses: camunda/infra-global-github-actions/generate-github-app-token-from-vault-secrets@ee746fa695a43480b4294e944a6bf6e01b4f8459 # main
              with:
                  github-app-id-vault-key: GITHUB_APP_ID
                  github-app-id-vault-path: secret/data/products/infrastructure-experience/ci/common
                  github-app-private-key-vault-key: GITHUB_APP_PRIVATE_KEY
                  github-app-private-key-vault-path: secret/data/products/infrastructure-experience/ci/common
                  vault-auth-method: approle
                  vault-auth-role-id: ${{ secrets.VAULT_ROLE_ID }}
                  vault-auth-secret-id: ${{ secrets.VAULT_SECRET_ID }}
                  vault-url: ${{ secrets.VAULT_ADDR }}

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The App token still authenticates the fetch; it is simply not written to
                  # `.git/config` afterwards. Nothing here talks to git over the network: the
                  # release is created through the API, with the same token passed as GH_TOKEN.
                  persist-credentials: false
                  fetch-depth: 0
                  token: ${{ steps.generate-github-token.outputs.token }}

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ steps.generate-github-token.outputs.token }}
                  BASELINE_TAG: ${{ needs.check-changes.outputs.baseline_tag }}
              run: |
                  set -euo pipefail

                  today="$(date -u +'%Y-%m-%d')"

                  # Find the next unused tag for today, considering both releases and remote tags
                  next_number=1
                  # Account for existing releases
                  last_release_number=$(gh release list --json tagName,createdAt --jq \
                    "[.[] | select(.createdAt | startswith(\"${today}\")) | .tagName | ltrimstr(\"${today}-\") | tonumber] | max // 0")
                  if [ "${last_release_number}" -ge "${next_number}" ]; then
                    next_number=$((last_release_number + 1))
                  fi
                  # Account for existing remote tags (e.g. from partial failures that pushed a tag but didn't create a release)
                  existing_tags=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/${today}-" --jq '.[].ref' | sed 's|refs/tags/||')
                  for tag in ${existing_tags}; do
                    tag_number=$(echo "${tag}" | sed "s/${today}-//" | sed 's/^0*//' )
                    tag_number=${tag_number:-0}
                    if [ "${tag_number}" -ge "${next_number}" ]; then
                      next_number=$((tag_number + 1))
                    fi
                  done

                  release_tag="${today}-$(printf '%03d' "${next_number}")"

                  # Verify there are commits since the last successfully published release.
                  # Same baseline as check-changes: comparing against the newest tag instead
                  # would exit here whenever the previous build failed on the current commit,
                  # which is precisely the case this release is meant to retry.
                  if [ -n "${BASELINE_TAG}" ]; then
                    if ! gh api "repos/${{ github.repository }}/git/ref/tags/${BASELINE_TAG}" --jq '.object.sha' >/dev/null 2>&1; then
                      echo "::error::Baseline release tag ${BASELINE_TAG} not found via API."
                      exit 1
                    fi
                    commit_count=$(gh api "repos/${{ github.repository }}/compare/${BASELINE_TAG}...${{ github.sha }}" --jq '.total_commits')
                    if [ "${commit_count}" -eq 0 ]; then
                      echo "No new commits since last published release ${BASELINE_TAG}, skipping."
                      exit 0
                    fi
                  fi

                  # If the tag already exists without a release (e.g. partial failure rerun), verify it points to the expected commit
                  if remote_tag_sha=$(gh api "repos/${{ github.repository }}/git/ref/tags/${release_tag}" --jq '.object.sha' 2>/dev/null); then
                    if [ "${remote_tag_sha}" != "${{ github.sha }}" ]; then
                      echo "::error::Tag ${release_tag} exists remotely but points to ${remote_tag_sha}, expected ${{ github.sha }}."
                      exit 1
                    fi
                    echo "Tag ${release_tag} already exists remotely and points to the expected commit, reusing it."
                    # Create the release from the existing tag
                    gh release create "${release_tag}" \
                      --title "${release_tag}" \
                      --generate-notes \
                      --verify-tag
                  else
                    # Let gh release create handle tag creation via the Releases API
                    gh release create "${release_tag}" \
                      --title "${release_tag}" \
                      --generate-notes \
                      --target "${{ github.sha }}"
                  fi

    report-failure:
        name: Report failures
        if: failure()
        runs-on: ubuntu-latest
        # `report-failure-on-slack` reads the open `silence: <workflow>` issues of this repository
        # to decide whether the alert is muted. Without `issues: read` it warns and alerts anyway,
        # which silently defeats the silencing mechanism.
        permissions:
            contents: read
            issues: read
        needs:
            - check-changes
            - release
        steps:
            - name: Notify in Slack in case of failure
              id: slack-notification
              uses: camunda/infraex-common-config/.github/actions/report-failure-on-slack@07d834a5174bbe971e1c0ab961a8605d389953a8 # 2.3.7
              with:
                  vault_addr: ${{ secrets.VAULT_ADDR }}
                  vault_role_id: ${{ secrets.VAULT_ROLE_ID }}
                  vault_secret_id: ${{ secrets.VAULT_SECRET_ID }}
