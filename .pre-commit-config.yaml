---
repos:
    - repo: https://github.com/camunda/infraex-common-config
      rev: 2.3.7 # use tags until renovate supports sha: https://github.com/renovatebot/renovate/issues/22567
      hooks:
          - id: update-action-readmes-docker

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
          - id: check-yaml
          - id: check-toml
          - id: check-json
          - id: check-symlinks
          - id: check-shebang-scripts-are-executable
          - id: detect-private-key

    - repo: https://github.com/hadolint/hadolint
      rev: v2.15.1
      hooks:
          # The upstream hook entry is `ghcr.io/hadolint/hadolint hadolint`, with no tag,
          # so it resolves to :latest and the linter version drifts away from the `rev`
          # above. That is how 2.15.1 arrived unannounced and turned every branch red
          # without a commit: it enables DL3066, which 2.14.0 did not report.
          # Pinning the image by digest keeps the linter on the version this `rev` names,
          # and lets Renovate move both together.
          - id: hadolint-docker
            entry: ghcr.io/hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint-docker

    - repo: https://github.com/zizmorcore/zizmor-pre-commit
      rev: v1.29.0
      hooks:
          # Static analysis of GitHub Actions workflows and actions, mirroring the hook adopted
          # in camunda/infraex-common-config#551. It covers what actionlint does not: injection
          # through template expansion, excessive GITHUB_TOKEN permissions, credential
          # persistence and unpinned action references. actionlint also only reads
          # `.github/workflows/`, so `.github/actions/` was linted by nothing until now.
          #
          # Threshold is `high` because the repository still carries medium and low findings
          # (mostly `artipacked` and `${{ steps.*.outputs }}` interpolation); `high` is clean as
          # of this commit and is what keeps it that way.
          #
          # Without GH_TOKEN zizmor runs offline, which skips known-vulnerable-actions,
          # impostor-commit, ref-confusion, ref-version-mismatch and stale-action-refs.
          # None of those currently report anything at `high`.
          #
          # --config makes the pinning policy explicit in .github/zizmor.yml rather than leaving
          # it to zizmor's defaults, so a future default change cannot silently drop
          # `unpinned-uses` below the threshold above.
          - id: zizmor
            args: [--no-progress, --min-severity=high, --config=.github/zizmor.yml]

    - repo: https://github.com/renovatebot/pre-commit-hooks
      rev: 44.33.2
      hooks:
          - id: renovate-config-validator
            args: [--strict]

    - repo: https://github.com/compilerla/conventional-pre-commit
      rev: v4.4.0
      hooks:
          - id: conventional-pre-commit
            stages: [commit-msg]
            args: [--strict, --force-scope]

    - repo: local
      hooks:
          - id: update-readme-version
            name: update-readme-version
            language: script
            always_run: true
            pass_filenames: false # ensure that we don't run the command multiple times
            entry: .pre-commit-hooks/update_readme_version.sh
            types: [text]
            stages: [pre-commit, pre-push, manual]

    - repo: https://github.com/adrienverge/yamllint
      rev: v1.38.0
      hooks:
          - id: yamllint
            args: [-c, .yamllint.yaml]

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt
